candidate_snapshot_path: "data/samples/v04_left_candidates_snapshot.csv"
output_csv_path: "outputs/kronos_v04_shadow_predictions.csv"
report_path: "docs/kronos_v04_shadow_report.md"

adapter:
  model_name: "NeoQuasar/Kronos-small"
  tokenizer_name: "NeoQuasar/Kronos-Tokenizer-base"
  device: "cuda:0"
  max_context: 512
  hf_cache_dir: "models/kronos/hf_cache"

inference:
  lookback: 120
  pred_len: 24
  sample_count: 1
  T: 1.0
  top_p: 0.9
  max_candidates: 2

safety:
  mode: "shadow_only"
  allow_trading_signal: false
  allow_order_execution: false
  allow_writeback_to_left_project: false
  allow_finetune: false
